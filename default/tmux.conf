# ~/.tmux.conf: executed by tmux

if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"

## ============================================================================
##                                 Colors
## ============================================================================

# Version C - best so far
# set -g default-terminal "xterm-256color"

# Version D - setting the terminal to "xterm-256color" was causing the home/end keys not to work in neovim
# set -g default-terminal "screen-256color"

# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"
# for tmux 3.2, you can use the following setting instead:
# set -as terminal-features ",xterm-256color:RGB"

# From vim's :help $TERM; this fixes home/end keys not working in vim
set -g default-terminal "tmux-256color"

## ============================================================================
##                               Key Bindings 
## ============================================================================

# Set "ctrl+b r" shortcut for reloading your tmux config
bind r source-file ~/.tmux.conf

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# The blocks below set up smart pane switching with awareness of Vim splits

# True when the pane runs nvim 
set -g @is_nvim '#{==:#{pane_current_command},nvim}'
# True when the pane runs nvim AND is not itself in copy mode (keys sent to a pane in copy mode would go to copy mode, not to nvim)
set -g @nvim_ready '#{&&:#{==:#{pane_current_command},nvim},#{==:#{pane_in_mode},0}}'

# Prefix + arrows: tmux panes and Neovim splits alike
# The tiny sleep lets nvim process the "jump to edge" key before focus moves.
bind -r Left  if-shell -F "#{E:@is_nvim}" 'send-keys M-Left'  "if-shell -F -t '{left-of}'  '#{E:@is_nvim}' \"send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'\" ; select-pane -L"
bind -r Down  if-shell -F "#{E:@is_nvim}" 'send-keys M-Down'  "if-shell -F -t '{down-of}'  '#{E:@is_nvim}' \"send-keys -t '{down-of}'  M-S-Up ; run-shell 'sleep 0.01'\"    ; select-pane -D"
bind -r Up    if-shell -F "#{E:@is_nvim}" 'send-keys M-Up'    "if-shell -F -t '{up-of}'    '#{E:@is_nvim}' \"send-keys -t '{up-of}'    M-S-Down ; run-shell 'sleep 0.01'\"  ; select-pane -U"
bind -r Right if-shell -F "#{E:@is_nvim}" 'send-keys M-Right' "if-shell -F -t '{right-of}' '#{E:@is_nvim}' \"send-keys -t '{right-of}' M-S-Left ; run-shell 'sleep 0.01'\"  ; select-pane -R"

# Ctrl-h/j/k/l: same as prefix + arrows, but without the prefix.
# The tiny sleep lets nvim process the "jump to edge" key before focus moves.
bind -n C-h if-shell -F "#{E:@is_nvim}" 'send-keys C-h' "if-shell -F -t '{left-of}'  '#{E:@is_nvim}' \"send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'\" ; select-pane -L"
bind -n C-j if-shell -F "#{E:@is_nvim}" 'send-keys C-j' "if-shell -F -t '{down-of}'  '#{E:@is_nvim}' \"send-keys -t '{down-of}'  M-S-Up ; run-shell 'sleep 0.01'\"    ; select-pane -D"
bind -n C-k if-shell -F "#{E:@is_nvim}" 'send-keys C-k' "if-shell -F -t '{up-of}'    '#{E:@is_nvim}' \"send-keys -t '{up-of}'    M-S-Down ; run-shell 'sleep 0.01'\"  ; select-pane -U"
bind -n C-l if-shell -F "#{E:@is_nvim}" 'send-keys C-l' "if-shell -F -t '{right-of}' '#{E:@is_nvim}' \"send-keys -t '{right-of}' M-S-Left ; run-shell 'sleep 0.01'\"  ; select-pane -R"

# Copy mode: same navigation as the root-table Ctrl-h/j/k/l bindings, except the current pane is in copy mode, so it 
# never forwards the key. It only moves, and positions a destination nvim first.
bind -T copy-mode-vi C-h if-shell -F -t '{left-of}'  '#{E:@nvim_ready}' "send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'" \; select-pane -L
bind -T copy-mode-vi C-j if-shell -F -t '{down-of}'  '#{E:@nvim_ready}' "send-keys -t '{down-of}'  M-S-Up    ; run-shell 'sleep 0.01'" \; select-pane -D
bind -T copy-mode-vi C-k if-shell -F -t '{up-of}'    '#{E:@nvim_ready}' "send-keys -t '{up-of}'    M-S-Down  ; run-shell 'sleep 0.01'" \; select-pane -U
bind -T copy-mode-vi C-l if-shell -F -t '{right-of}' '#{E:@nvim_ready}' "send-keys -t '{right-of}' M-S-Left   ; run-shell 'sleep 0.01'" \; select-pane -R

## ============================================================================
##                                Status Bar
## ============================================================================
# Put the status bar on top
set -g status-position top

# Left side of status bar
# Show session name and hostname in my choice of colors
set -g status-left-length 20
set -g status-left '#[fg=green][#[bg=black,fg=cyan]#S#[bg=black,fg=blue,dim]:#H#[fg=green]]'

## Middle of status bar, window labels
# Inactive windows in status bar
set-window-option -g window-status-format '#[fg=cyan,dim]#I#[fg=blue]:#[default]#W#[fg=grey,dim]#F'
# Current or active window in status bar
set-window-option -g window-status-current-format '#[bg=blue,fg=cyan,bold]#I#[bg=blue,fg=cyan]:#[fg=white]#W#[fg=dim]#F'

## Right side of status bar
# show current window title, date and time in my choice of colors
set -g status-right '#[fg=green][#[fg=black]#T#[fg=green]][#[fg=black]%Y-%m-%d #[fg=black]%H:%M#[default]#[fg=green]]'
