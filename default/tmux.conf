# ~/.tmux.conf: executed by tmux

if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"

## =====================================================================================
##                                        Colors
## =====================================================================================

# Version C - best so far
# set -g default-terminal "xterm-256color"

# Version D - setting the terminal to "xterm-256color" was causing the home/end keys not
#             to work in neovim
# set -g default-terminal "screen-256color"

# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"
# for tmux 3.2, you can use the following setting instead:
# set -as terminal-features ",xterm-256color:RGB"

# From vim's :help $TERM; this fixes home/end keys not working in vim
set -g default-terminal "tmux-256color"

## =====================================================================================
##                                     Key Bindings
## =====================================================================================

# Set "ctrl+b r" shortcut for reloading your tmux config
bind r source-file ~/.tmux.conf

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

## =====================================================================================
##                                      Status Bar
## =====================================================================================
# Put the status bar on top
set -g status-position top

# Left side of status bar
# Show session name and hostname in my choice of colors
set -g status-left-length 20
set -g status-left '#[fg=green][#[bg=black,fg=cyan]#S#[bg=black,fg=blue,dim]:#H#[fg=green]]'

# Middle of status bar, window labels
# Inactive windows in status bar
set-window-option -g window-status-format '#[fg=cyan,dim]#I#[fg=blue]:#[default]#W#[fg=grey,dim]#F'
# Current or active window in status bar
set-window-option -g window-status-current-format '#[bg=blue,fg=cyan,bold]#I#[bg=blue,fg=cyan]:#[fg=white]#W#[fg=dim]#F'

# Right side of status bar
# show current window title, date and time in my choice of colors
set -g status-right '#[fg=green][#[fg=black]#T#[fg=green]][#[fg=black]%Y-%m-%d #[fg=black]%H:%M#[default]#[fg=green]]'

## =====================================================================================
##                             Smart neovim/tmux Navigation
## =====================================================================================
#
# WHAT THIS DOES
#   Ctrl-h/j/k/l and Prefix+arrows move focus between tmux panes AND Neovim windows
#   (splits) running inside a pane, as if everything were one flat layout. Moving into a
#   Neovim pane lands on the window nearest the side you came from. Movement wraps
#   around at the edges. The Neovim half lives in config/nvim/lua/tmux_nav.lua;
#   both files share the key names below, so change them together.
#
# HOW THE WORK IS SPLIT
#   tmux knows the pane layout, Neovim knows its own window layout. Each side moves
#   focus when it can and hands off to the other when it runs out of room:
#     - current pane is not nvim:  tmux moves focus itself
#     - current pane is nvim:      tmux forwards a key; nvim moves between its windows
#                                  and, at its edge, asks tmux to move focus (Lua side)
#     - destination pane is nvim:  before moving focus, tmux tells that nvim which edge
#                                  to land on, so the cursor never flashes in the wrong
#                                  window
#
# KEYS TMUX SENDS INTO NVIM ("carrier" keys, mapped in tmux_nav.lua)
#   Ctrl-h/j/k/l  forwarded unchanged by the root-table bindings (no prefix involved)
#   M-<arrow>     "move one step that way". Used by the prefix bindings, because tmux
#                 consumes the prefix and nvim never sees what you pressed. Alt+arrow is
#                 used because no other key is safe in every mode: Ctrl-w would delete a
#                 word in insert mode, and Ctrl-h/j/k/l mean backspace/Enter/etc. where
#                 nvim leaves them unmapped (operator-pending, command-line)
#   M-S-<arrow>   "jump to the far edge". Sent to the DESTINATION nvim just before focus
#                 moves. The direction is opposite to the move: going Left enters from
#                 the right, so it sends M-S-Right (rightmost window)
#
# THE TWO CHECKS
#   @is_nvim     the pane's foreground process is nvim
#   @nvim_ready  same, and the pane is not in copy mode
#                (keys sent to a pane in copy mode go to copy mode, not to nvim)
#   They are options holding format strings, hence #{E:...} to expand them, and
#   if-shell -F to evaluate a format instead of running a shell command.
#
# ANATOMY OF ONE BINDING (Left shown; the others are analogous)
#   bind Left  IF the current pane is nvim (and not in copy mode)
#              THEN  send-keys M-Left                         nvim handles it
#              ELSE  IF the pane to the left is nvim:
#                        send it M-S-Right, wait 10 ms        position it first
#                    select-pane -L                           then move focus
#   - -t '{left-of}' makes the condition and send-keys address the pane to the left of
#     the active pane, i.e. the destination. It is resolved before select-pane moves
#     focus, which is why the order matters.
#   - select-pane sits outside the inner if-shell, so focus always moves, nvim or not.
#   - The sleep gives the destination nvim time to process the edge key before it gets
#     focus. Raise it if the cursor flashes in the wrong window on a slower machine.
#
# THREE KEY TABLES, THREE FAMILIES
#   prefix table (bind)      Prefix+arrows. Also active while a pane is in copy mode, so
#                            its source check uses @nvim_ready.
#   root table (bind -n)     Ctrl-h/j/k/l. Not consulted while a pane is in copy mode
#                            (tmux uses that mode's table instead), so @is_nvim is
#                            enough.
#   copy-mode-vi (bind -T)   Ctrl-h/j/k/l while scrolling back. The current pane is in
#                            copy mode and not talking to nvim, so nothing is forwarded:
#                            these only position a destination nvim and move focus.
#   Destination checks use @is_nvim, except in the copy-mode bindings, which use
#   @nvim_ready. The difference is harmless: copy mode ignores the stray edge key.
#
# ASSUMPTIONS AND LIMITS
#   - The pane's process must be named exactly "nvim" (the AppImage is symlinked as
#     ~/.local/bin/nvim).
#   - Needs a recent tmux (#{E:...} formats, {left-of} targets); developed on 3.x.
#   - An nvim pane that is itself in copy mode cannot be repositioned.
#   - Nvim's --More-- and hit-enter prompts read keys before any mapping, so navigation
#     keys are consumed there; dismiss the prompt first.

# --- Pane checks -----------------------------------------------------------------
# Format strings stored as user options (@name), so every binding can reuse them.
# Format syntax: #{==:a,b} is string equality, #{&&:a,b} is logical AND, and
# #{pane_in_mode} is 1 while the pane is in a mode such as copy mode, else 0.

# True when the pane's foreground process is nvim
set -g @is_nvim '#{==:#{pane_current_command},nvim}'

# True when the pane runs nvim AND is not in copy mode
# (keys sent to a pane in copy mode go to copy mode, not to nvim)
set -g @nvim_ready '#{&&:#{==:#{pane_current_command},nvim},#{==:#{pane_in_mode},0}}'

# --- Prefix + arrows -------------------------------------------------------------
# Each binding has the same shape, with only the direction swapped:
#
#   key    forwarded to nvim   edge key sent to destination   tmux direction
#   Left   M-Left              M-S-Right                      -L / {left-of}
#   Down   M-Down              M-S-Up                         -D / {down-of}
#   Up     M-Up                M-S-Down                       -U / {up-of}
#   Right  M-Right             M-S-Left                       -R / {right-of}
#
# Logic: if the current pane is nvim (and not in copy mode), forward the carrier key
# and let nvim handle it. Otherwise, if the neighbouring pane is nvim, tell it which
# edge to land on, wait 10 ms for it to process that key, then move focus.
# The tiny sleep lets nvim process the "jump to edge" key before focus moves.
bind Left  if-shell -F "#{E:@nvim_ready}" 'send-keys M-Left'  "if-shell -F -t '{left-of}'  '#{E:@is_nvim}' \"send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'\" ; select-pane -L"
bind Down  if-shell -F "#{E:@nvim_ready}" 'send-keys M-Down'  "if-shell -F -t '{down-of}'  '#{E:@is_nvim}' \"send-keys -t '{down-of}'  M-S-Up ; run-shell 'sleep 0.01'\"    ; select-pane -D"
bind Up    if-shell -F "#{E:@nvim_ready}" 'send-keys M-Up'    "if-shell -F -t '{up-of}'    '#{E:@is_nvim}' \"send-keys -t '{up-of}'    M-S-Down ; run-shell 'sleep 0.01'\"  ; select-pane -U"
bind Right if-shell -F "#{E:@nvim_ready}" 'send-keys M-Right' "if-shell -F -t '{right-of}' '#{E:@is_nvim}' \"send-keys -t '{right-of}' M-S-Left ; run-shell 'sleep 0.01'\"  ; select-pane -R"

# --- Ctrl-h/j/k/l (root table: no prefix needed) ---------------------------------
# Same logic as above, with two differences:
#   - the source check is @is_nvim: the root table is not consulted while a pane is in
#     copy mode, so @nvim_ready would be redundant
#   - the key forwarded to nvim is the Ctrl key itself, because no prefix was consumed
# The tiny sleep lets nvim process the "jump to edge" key before focus moves.
bind -n C-h if-shell -F "#{E:@is_nvim}" 'send-keys C-h' "if-shell -F -t '{left-of}'  '#{E:@is_nvim}' \"send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'\" ; select-pane -L"
bind -n C-j if-shell -F "#{E:@is_nvim}" 'send-keys C-j' "if-shell -F -t '{down-of}'  '#{E:@is_nvim}' \"send-keys -t '{down-of}'  M-S-Up ; run-shell 'sleep 0.01'\"    ; select-pane -D"
bind -n C-k if-shell -F "#{E:@is_nvim}" 'send-keys C-k' "if-shell -F -t '{up-of}'    '#{E:@is_nvim}' \"send-keys -t '{up-of}'    M-S-Down ; run-shell 'sleep 0.01'\"  ; select-pane -U"
bind -n C-l if-shell -F "#{E:@is_nvim}" 'send-keys C-l' "if-shell -F -t '{right-of}' '#{E:@is_nvim}' \"send-keys -t '{right-of}' M-S-Left ; run-shell 'sleep 0.01'\"  ; select-pane -R"

# --- Ctrl-h/j/k/l while scrolling back (copy mode) -------------------------------
# While a pane is in copy mode, tmux uses the copy-mode-vi table instead of the root
# table, so the keys need their own bindings here. The current pane is in copy mode
# and not talking to nvim, so nothing is forwarded: these only position a destination
# nvim (when the neighbouring pane is nvim and not itself in copy mode) and move focus.
# "\;" chains the second command, in place of the quoted "; select-pane" above.
bind -T copy-mode-vi C-h if-shell -F -t '{left-of}'  '#{E:@nvim_ready}' "send-keys -t '{left-of}'  M-S-Right ; run-shell 'sleep 0.01'" \; select-pane -L
bind -T copy-mode-vi C-j if-shell -F -t '{down-of}'  '#{E:@nvim_ready}' "send-keys -t '{down-of}'  M-S-Up    ; run-shell 'sleep 0.01'" \; select-pane -D
bind -T copy-mode-vi C-k if-shell -F -t '{up-of}'    '#{E:@nvim_ready}' "send-keys -t '{up-of}'    M-S-Down  ; run-shell 'sleep 0.01'" \; select-pane -U
bind -T copy-mode-vi C-l if-shell -F -t '{right-of}' '#{E:@nvim_ready}' "send-keys -t '{right-of}' M-S-Left   ; run-shell 'sleep 0.01'" \; select-pane -R
